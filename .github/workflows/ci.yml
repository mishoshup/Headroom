name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
        if: runner.os != 'Windows'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Out-String | Write-Error; exit 1 }
      - name: Exercise PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HEADROOM_HOME = Join-Path $env:RUNNER_TEMP "headroom-home"
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "headroom-config"
          pwsh -NoProfile -File scripts/install.ps1 -Build -Force
          & (Join-Path $env:HEADROOM_HOME "headroom.exe") self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
