[package]
name = "usage-pacer"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Subscription usage pacing for Claude Code"
license = "MIT"
authors = ["danialhaikal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
