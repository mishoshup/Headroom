[package]
name = "headroom"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Weekly usage pacing for Claude Code"
repository = "https://github.com/mishoshup/Headroom"
homepage = "https://github.com/mishoshup/Headroom"
license = "MIT"
authors = ["Mishoshup"]
keywords = ["claude-code", "usage", "rate-limit", "statusline", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
